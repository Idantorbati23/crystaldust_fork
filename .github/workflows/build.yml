name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y build-essential pkg-config git python3

      - name: Build tools and agbcc
        run: |
          make -C tools/agbcc
          make -C tools/preproc

      - name: Compile ROM
        run: |
          make -j$(nproc)
