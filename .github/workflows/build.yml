name: Build CrystalDust ROM

on:
  push:
    branches:
      - master
      - main
      - progress # or whatever your active branch is
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark workspace directory as safe for Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y \
            build-essential \
            git \
            libpng-dev \
            g++ \
            make \
            cmake \
            python3 \
            python3-pip

      - name: Configure DevkitARM Environment
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitarm" >> $GITHUB_PATH
      - name: Compile CrystalDust ROM
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitarm
          export PATH="$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH"
          make -j$(nproc) MODERN=1 COMPARE=0

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystaldust-rom
          path: |
            *.gba
            *.elf
            *.map
          if-no-files-found: error
