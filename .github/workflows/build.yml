name: Build CrystalDust ROM

on:
  push:
    branches: [ "main", "master", "progress" ]
  pull_request:
    branches: [ "main", "master", "progress" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/toolchain-base:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GBA Development Toolchain
        run: |
          dkp-pacman -Syu --noconfirm gba-dev devkitarm-rules

      - name: Compile ROM
        run: |
          make -j$(nproc)

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystaldust-rom
          path: |
            *.gba
            *.map
