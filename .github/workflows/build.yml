name: Build CrystalDust ROM

on:
  push:
    branches: [ "main", "master", "progress" ]
  pull_request:
    branches: [ "main", "master", "progress" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/toolchain-base:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Git Safe Directory Ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure agbcc Tool Exists
        run: |
          if [ ! -d "tools/agbcc" ] || [ -z "$(ls -A tools/agbcc)" ]; then
            echo "tools/agbcc is missing or empty. Cloning directly..."
            rm -rf tools/agbcc
            git clone https://github.com/pret/agbcc tools/agbcc
          else
            echo "tools/agbcc found."
          fi

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            python3 \
            libpng-dev \
            zlib1g-dev \
            wget

      - name: Bypass Cloudflare 403 by Configuring Wget User-Agent for Pacman
        run: |
          # Add XferCommand using wget with a custom user-agent string to pacman.conf
          if ! grep -q "XferCommand" /etc/pacman.conf; then
            sed -i '/\[options\]/a XferCommand = /usr/bin/wget -U "dkp-pacman" --passive-ftp -c -O %o %u' /etc/pacman.conf
          fi

      - name: Install GBA Toolchain via dkp-pacman
        run: |
          dkp-pacman -Syu --noconfirm gba-dev devkitarm-rules

      - name: Build Project Tools and Compile ROM
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${PATH}

          # Build agbcc and preproc tools explicitly
          if [ -f "tools/agbcc/build.sh" ]; then
            cd tools/agbcc && ./build.sh && cd ../..
          else
            make -C tools/agbcc || gcc -O2 tools/agbcc/agbcc.c -o tools/agbcc/agbcc
          fi

          if [ -d "tools/preproc" ]; then
            make -C tools/preproc || true
          fi

          # Compile the final ROM
          make -j$(nproc)

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystaldust-rom
          path: |
            *.gba
            *.map
