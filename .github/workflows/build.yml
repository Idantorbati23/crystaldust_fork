name: Build CrystalDust ROM

on:
  push:
    branches: [ "main", "master", "progress" ]
  pull_request:
    branches: [ "main", "master", "progress" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/toolchain-base:latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fix Git Safe Directory Ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure agbcc Tool Exists & Is Valid
        run: |
          if [ ! -d "tools/agbcc" ] || [ -z "$(ls -A tools/agbcc)" ]; then
            echo "tools/agbcc is missing or empty. Cloning directly..."
            rm -rf tools/agbcc
            git clone https://github.com/pret/agbcc tools/agbcc
          else
            echo "tools/agbcc found."
          fi

      - name: Install System Dependencies & ARM Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            python3 \
            libpng-dev \
            zlib1g-dev \
            curl \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

      - name: Build Tools Sequentially
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=/usr/bin:${DEVKITARM}/bin:${PATH}

          # 1. Build agbcc explicitly
          if [ -f "tools/agbcc/build.sh" ]; then
            cd tools/agbcc && ./build.sh && cd ../..
          else
            make -C tools/agbcc CC=gcc CXX=g++
          fi

          # 2. Build repository tools sequentially
          if make -n tools >/dev/null 2>&1; then
            make tools
          else
            make -C tools/preproc || true
            make -C tools/gbagfx || true
            make -C tools/jsonproc || true
          fi

      - name: Compile Final ROM Safely
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=/usr/bin:${DEVKITARM}/bin:${PATH}
          
          # Explicitly export agbcc environment variables and include paths
          export AGBCC="$PWD/tools/agbcc/agbcc"
          export CC1="$PWD/tools/agbcc/agbcc"
          
          # Find the exact path of arm-none-eabi gcc include directory for stddef.h
          GCC_INCLUDE_DIR=$(arm-none-eabi-gcc -print-file-name=include)
          export CFLAGS="-I$GCC_INCLUDE_DIR -I$PWD/tools/agbcc/include"
          export CPPFLAGS="-I$GCC_INCLUDE_DIR -I$PWD/tools/agbcc/include"

          ls -l "$AGBCC"
          echo "Using GCC include directory: $GCC_INCLUDE_DIR"

          # Compile ROM
          make

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystaldust-rom-${{ github.ref_name }}-${{ github.sha }}
          path: |
            *.gba
            *.map
