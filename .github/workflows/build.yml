name: Build CrystalDust ROM

on:
  push:
    branches: [ "main", "master", "progress" ]
  pull_request:
    branches: [ "main", "master", "progress" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/toolchain-base:latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix Git Safe Directory Ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Explicitly Fetch Submodules
        run: |
          git submodule foreach --recursive git submodule update --init --force

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            python3 \
            libpng-dev \
            zlib1g-dev

      - name: Install GBA Toolchain via dkp-pacman
        run: |
          dkp-pacman -Syu --noconfirm gba-dev devkitarm-rules

      - name: Build Project Tools and ROM
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${PATH}

          # Clean any old states
          make clean || true

          # Build agbcc and preproc tools
          make -C tools/agbcc
          make -C tools/preproc

          # Compile the final ROM
          make -j$(nproc)

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystaldust-rom
          path: |
            *.gba
            *.map
