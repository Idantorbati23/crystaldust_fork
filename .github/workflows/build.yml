name: Build CrystalDust ROM

on:
  push:
    branches: [ "main", "master", "progress" ]
  pull_request:
    branches: [ "main", "master", "progress" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/toolchain-base:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            python3 \
            libpng-dev \
            zlib1g-dev

      - name: Install GBA Toolchain via dkp-pacman
        run: |
          dkp-pacman -Syu --noconfirm gba-dev devkitarm-rules

      - name: Build Project Tools and ROM
        shell: bash
        run: |
          # Export devkitARM environment variables so make finds toolchain binaries
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${PATH}

          # Ensure a completely pristine build directory to clear duplicate object bugs
          make clean

          # Build tools first (agbcc, preproc, gbagfx, etc.) explicitly
          make tools -j$(nproc)

          # Compile the ROM safely (using single-core or parallel safely)
          make -j$(nproc)

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystaldust-rom
          path: |
            *.gba
            *.map
