name: Build CrystalDust ROM

on:
  push:
    branches: [ "main", "master", "progress" ]
  pull_request:
    branches: [ "main", "master", "progress" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/toolchain-base:latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fix Git Safe Directory Ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure agbcc Tool Exists & Is Valid
        run: |
          if [ ! -d "tools/agbcc" ] || [ -z "$(ls -A tools/agbcc)" ]; then
            echo "tools/agbcc is missing or empty. Cloning directly..."
            rm -rf tools/agbcc
            git clone https://github.com/pret/agbcc tools/agbcc
          else
            echo "tools/agbcc found."
          fi

      - name: Build ROM and All Dependencies
        shell: bash
        run: |
          # 1. Install System Dependencies & ARM Toolchain inside the container
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            python3 \
            libpng-dev \
            zlib1g-dev \
            curl \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

          # 2. Configure Environment Paths
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=/usr/bin:${DEVKITARM}/bin:${PATH}

          # 3. Build and Install agbcc (populates include headers like stddef.h)
          if [ -f "tools/agbcc/build.sh" ]; then
            cd tools/agbcc
            ./build.sh
            ./install.sh ..
            cd ../..
          else
            make -C tools/agbcc CC=gcc CXX=g++
          fi

          # 4. Build repository tools safely using the root target or fallback loop
          make tools || {
            echo "Standard 'make tools' failed or missing, building individual tools..."
            for tool in aif2pcm bin2c gbafix gbagfx jsonproc mapjson mid2agb preproc ramscrgen rsfont scaninc xorencrypt; do
              if [ -d "tools/$tool" ]; then
                make -C "tools/$tool" || true
              fi
            done
          }

          # 5. Export agbcc environment variables and compiler flags for stddef.h resolution
          export AGBCC="$PWD/tools/agbcc/agbcc"
          export CC1="$PWD/tools/agbcc/agbcc"
          export AGBCCFLAGS="-I$PWD/tools/agbcc/include"
          
          # Get GCC include path for standard headers
          GCC_INC=$(arm-none-eabi-gcc -print-file-name=include)
          export CFLAGS="-I$GCC_INC -I$PWD/tools/agbcc/include"
          export CPPFLAGS="-I$GCC_INC -I$PWD/tools/agbcc/include"

          # 6. Compile the Final ROM
          make

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystaldust-rom-${{ github.ref_name }}-${{ github.sha }}
          path: |
            *.gba
            *.map
