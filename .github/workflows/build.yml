name: Build CrystalDust ROM

on:
  push:
    branches: [ "main", "master", "progress" ]
  pull_request:
    branches: [ "main", "master", "progress" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/toolchain-base:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Submodules are Synced
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Verify agbcc Folder Exists
        run: |
          if [ ! -d "tools/agbcc" ]; then
            echo "Error: tools/agbcc directory is missing!"
            exit 1
          fi
          ls -la tools/agbcc

      - name: Install System Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            python3 \
            libpng-dev \
            zlib1g-dev

      - name: Install GBA Toolchain via dkp-pacman
        run: |
          dkp-pacman -Syu --noconfirm gba-dev devkitarm-rules

      - name: Build Project Tools and ROM
        shell: bash
        run: |
          # Export devkitARM environment variables
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=${DEVKITARM}/bin:${PATH}

          # Build agbcc and preproc explicitly
          make -C tools/agbcc
          make -C tools/preproc

          # Compile the ROM
          make -j$(nproc)

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystaldust-rom
          path: |
            *.gba
            *.map
