name: Build CrystalDust ROM

on:
  push:
    branches: [ "main", "master", "progress" ]
  pull_request:
    branches: [ "main", "master", "progress" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/toolchain-base:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Git Safe Directory Ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure agbcc Tool Exists
        run: |
          if [ ! -d "tools/agbcc" ] || [ -z "$(ls -A tools/agbcc)" ]; then
            echo "tools/agbcc is missing or empty. Cloning directly..."
            rm -rf tools/agbcc
            git clone https://github.com/pret/agbcc tools/agbcc
          else
            echo "tools/agbcc found."
          fi

      - name: Install System Dependencies & ARM Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            git \
            python3 \
            libpng-dev \
            zlib1g-dev \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi

      - name: Build Project Tools and Compile ROM
        shell: bash
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          export PATH=/usr/bin:${DEVKITARM}/bin:${PATH}

          # Ensure symlinks for cross-compiler tools are explicitly verified
          which arm-none-eabi-as
          which arm-none-eabi-ar
          which arm-none-eabi-gcc

          # 1. Build agbcc explicitly with proper environment variables
          if [ -f "tools/agbcc/build.sh" ]; then
            cd tools/agbcc && ./build.sh && cd ../..
          else
            make -C tools/agbcc CC=gcc CXX=g++
          fi

          # 2. Build preproc tool if available
          if [ -d "tools/preproc" ]; then
            make -C tools/preproc || true
          fi

          # 3. Clean any lingering build artifacts to prevent duplicate .o errors (arm-none-eabi-ar exit code 2)
          make clean || true

          # 4. Compile the final ROM in parallel
          make -j$(nproc)

      - name: Upload Compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: crystaldust-rom
          path: |
            *.gba
            *.map
